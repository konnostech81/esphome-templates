esphome:
  name: switchman-m5-1c
  friendly_name: SwitchMan M5-1C

  project:
    name: "konnostech81.switchman_m5_1c"
    version: "1.0.0"

  on_boot:
    priority: -100
    then:
      - delay: 500ms

      # Set normal background brightness
      - light.turn_on:
          id: background_led
          brightness: ${red_led_background_brightness}
          transition_length: 0s

      # Synchronize the dedicated red LED control
      # with the restored relay state.
      - if:
          condition:
            switch.is_on: relay_1
          then:
            - output.turn_on: red_led
          else:
            - output.turn_off: red_led
  
esp32:
  board: esp32dev
  framework:
    type: arduino
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  # encryption:
  #   key: !secret switchman_m5_1c_encryption_key

  on_client_connected:
    then:
      - if:
          condition:
            api.connected:
              state_subscription_only: true
          then:
            - script.stop: blink_wifi_down
            - script.stop: blink_api_down
            - light.turn_off: blue_led

  on_client_disconnected:
    then:
      - delay: 1s

      - if:
          condition:
            and:
              - wifi.connected:
              - not:
                  api.connected:
                    state_subscription_only: true
          then:
            - script.execute: blink_api_down

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # use_address: your static ip

  power_save_mode: none

  on_disconnect:
    then:
      - script.stop: blink_api_down
      - script.execute: blink_wifi_down

  on_connect:
    then:
      - script.stop: blink_wifi_down
      - light.turn_off: blue_led

      - if:
          condition:
            not:
              api.connected:
                state_subscription_only: true
          then:
            - script.execute: blink_api_down

captive_portal:

switch:
  - platform: gpio
    id: relay_1
    name: "Button"
    pin: 23
    restore_mode: RESTORE_DEFAULT_OFF

    on_turn_on:
      - output.turn_on: red_led

    on_turn_off:
      - output.turn_off: red_led

button:
  - platform: template
    name: "Test / Identify Device"
    id: test_identify_button
    icon: "mdi:lightbulb-alert-outline"
    entity_category: diagnostic
    on_press:
      - script.execute: test_identify_leds
    
output:
    # Red LED enable for 1-gang
  - platform: gpio
    id: red_led
    pin:
      number: GPIO19
      inverted: false
      
  # Controls off-state brightness of the red LEDs.
  - platform: ledc
    id: pwm_output
    pin: 18
    frequency: 1000 Hz

  # Status LED brightness
  - platform: ledc
    id: blue_pwm
    pin:
      number: GPIO5
      inverted: true
    frequency: 1000 Hz
    
light:
  # Background brightness for red LED when relay is OFF
  - platform: monochromatic
    output: pwm_output
    name: "Switch LED Background Brightness"
    id: background_led
    icon: "mdi:led-outline"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_ON
      
  # Blue LED brightness slider
  - platform: monochromatic
    output: blue_pwm
    name: "Blue LED Brightness"
    id: blue_led
    icon: "mdi:led-outline"
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF

text_sensor:
  # - platform: template
  #   name: "Deployment Version"
  #   lambda: return {"${sw_version}"};
  #   icon: "mdi:tag"
  #   entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      id: ip_address
      name: "IP Address"
      icon: "mdi:wan"

  - platform: template
    name: "Device Manufacturer"
    id: device_manufacturer
    entity_category: diagnostic
    lambda: |-
      return {"SONOFF"};

  - platform: template
    name: "Device Model"
    id: device_model
    entity_category: diagnostic
    lambda: |-
      return {"SwitchMan M5-1C-86"}; # or SwitchMan M5-1C-80

  - platform: template
    name: "Firmware Version"
    id: firmware_version
    entity_category: diagnostic
    lambda: |-
      return {"1.0.0"};
    
sensor:
  - platform: template
    id: internal_temp
    name: "Internal Temperature"
    icon: "mdi:thermometer"
    unit_of_measurement: "°C"
    entity_category: diagnostic
    disabled_by_default: true
    lambda: return temperatureRead();

  - platform: wifi_signal
    name: "RSSI"
    id: sensor_rssi
    update_interval: 90s
    entity_category: "diagnostic"

  - platform: uptime
    name: "Uptime"
    id: sensor_uptime
    update_interval: 300s
    entity_category: "diagnostic"

binary_sensor:
  - platform: gpio
    id: main_button
    pin:
      number: 0
      mode: INPUT_PULLUP
    on_press:
      - switch.toggle: relay_1

script:

  # ==========================================================
  # WiFi DOWN
  # One blue blink every status_period
  # ==========================================================
  - id: blink_wifi_down
    mode: restart
    then:
      - while:
          condition:
            not:
              wifi.connected:
          then:
            - light.turn_on:
                id: blue_led
                brightness: 100%
                transition_length: 0s

            - delay: ${blink_time}

            - light.turn_off:
                id: blue_led
                transition_length: 0s

            - delay: ${status_period}


  # ==========================================================
  # WiFi OK, but Home Assistant API DOWN
  # Three blue blinks every status_period
  # ==========================================================
  - id: blink_api_down
    mode: restart
    then:
      - while:
          condition:
            and:
              - wifi.connected:
              - not:
                  api.connected:
                    state_subscription_only: true
          then:

            # Blink 1
            - light.turn_on:
                id: blue_led
                brightness: 100%
                transition_length: 0s
            - delay: ${blink_time}
            - light.turn_off:
                id: blue_led
                transition_length: 0s
            - delay: ${blink_time}

            # Blink 2
            - light.turn_on:
                id: blue_led
                brightness: 100%
                transition_length: 0s
            - delay: ${blink_time}
            - light.turn_off:
                id: blue_led
                transition_length: 0s
            - delay: ${blink_time}

            # Blink 3
            - light.turn_on:
                id: blue_led
                brightness: 100%
                transition_length: 0s
            - delay: ${blink_time}
            - light.turn_off:
                id: blue_led
                transition_length: 0s

            - delay: ${status_period}


  # ==========================================================
  # TEST / IDENTIFY DEVICE
  # Alternates BLUE / RED LEDs
  # ==========================================================
  - id: test_identify_leds
    mode: restart
    then:
      # Temporarily stop warning patterns
      - script.stop: blink_wifi_down
      - script.stop: blink_api_down

      # BLUE
      - light.turn_off: background_led
      - light.turn_on:
          id: blue_led
          brightness: 100%
          transition_length: 0s
      - delay: 500ms

      # RED
      - light.turn_off:
          id: blue_led
          transition_length: 0s
      - light.turn_on:
          id: background_led
          brightness: 100%
          transition_length: 0s
      - delay: 500ms

      # BLUE
      - light.turn_off:
          id: background_led
          transition_length: 0s
      - light.turn_on:
          id: blue_led
          brightness: 100%
          transition_length: 0s
      - delay: 500ms

      # RED
      - light.turn_off:
          id: blue_led
          transition_length: 0s
      - light.turn_on:
          id: background_led
          brightness: 100%
          transition_length: 0s
      - delay: 500ms

      # BLUE
      - light.turn_off:
          id: background_led
          transition_length: 0s
      - light.turn_on:
          id: blue_led
          brightness: 100%
          transition_length: 0s
      - delay: 500ms

      # RED
      - light.turn_off:
          id: blue_led
          transition_length: 0s
      - light.turn_on:
          id: background_led
          brightness: 100%
          transition_length: 0s
      - delay: 500ms

      # Finish test
      - light.turn_off:
          id: blue_led
          transition_length: 0s

      # Return red background led to your normal
      - light.turn_on:
          id: background_led
          brightness: ${red_led_background_brightness}
          transition_length: 0s

      # Resume correct warning mode if needed
      - if:
          condition:
            not:
              wifi.connected:
          then:
            - script.execute: blink_wifi_down
          else:
            - if:
                condition:
                  not:
                    api.connected:
                      state_subscription_only: true
                then:
                  - script.execute: blink_api_down
substitutions:
  status_period: "1800ms"
  blink_time: "250ms"
  red_led_background_brightness: 30%